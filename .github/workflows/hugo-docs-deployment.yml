# Builds hugoplate/ with Hugo and publishes it to the root of gh-pages.
# API reference docs (doxygen-deployment.yml) live under /api/ on the same branch.
name: Hugo Docs Deployment

on:
  push:
    branches: ["jazzy"]
    paths: ["hugoplate/**"]
  workflow_dispatch:

env:
  HUGO_VERSION: "0.165.0"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: hugoplate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: hugoplate/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: hugoplate/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: hugoplate/public
          keep_files: true
