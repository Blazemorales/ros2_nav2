<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rover Chat</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #e2e0da; --accent: #2f6fb3; --user: #e8f0f9; --tool: #f1efe9;
    --ok: #2e7d4f; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #9a9892;
      --line: #33322f; --accent: #6ea8e6; --user: #1f2d3d; --tool: #262523;
      --ok: #6cc28f; --bad: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  /* the author display rules below (flex) would otherwise override [hidden] */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex;
         flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 12px; padding-bottom: 12px;
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad);
         display: inline-block; margin-right: 6px; }
  .dot.on { background: var(--ok); }
  #status { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex;
         flex-direction: column; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 10px; max-width: 90%;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { background: var(--user); align-self: flex-end; }
  .bot { background: var(--panel); border: 1px solid var(--line); }
  .tool { background: var(--tool); color: var(--muted); font: 12.5px/1.45 ui-monospace,
          SFMono-Regular, Menlo, monospace; }
  .err { color: var(--bad); }
  form { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px;
          border: 1px solid var(--line); background: var(--panel); color: var(--text);
          font: inherit; }
  button { padding: 10px 14px; border-radius: 8px; border: 0; font: inherit;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #stop { background: var(--bad); }
  #login { margin: auto; display: flex; flex-direction: column; gap: 10px;
           width: min(320px, 100%); }
  .hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Rover Chat</h1>
    <span id="status"><span class="dot"></span>desconectado</span>
    <button id="stop" type="button" disabled title="Para o rover sem passar pela IA">PARAR</button>
  </header>

  <form id="login">
    <p class="hint">Converse com o rover da simulação. Ex.: "onde você está?",
      "vá para x=2, y=1", "ative a exploração", "pare".</p>
    <input id="pw" type="password" placeholder="senha" autocomplete="current-password">
    <button>Entrar</button>
  </form>

  <div id="log" hidden></div>
  <form id="chat" hidden>
    <input id="text" placeholder="Mande uma ordem para o rover…" autocomplete="off">
    <button id="send">Enviar</button>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
let ws, busy = false;

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function setOnline(on) {
  $("status").innerHTML = `<span class="dot ${on ? "on" : ""}"></span>` +
    (on ? "rover online" : "rover offline");
  $("stop").disabled = !on;
}
function setBusy(b) { busy = b; $("send").disabled = b; }

function connect(pw) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/chat`);
  ws.onopen = () => ws.send(JSON.stringify({ password: pw }));
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "status") {
      $("login").hidden = true; $("log").hidden = false; $("chat").hidden = false;
      try { sessionStorage.setItem("pw", pw); } catch (e) {}
      setOnline(m.online); $("text").focus();
    } else if (m.type === "tool") {
      add("tool", `→ ${m.name}(${JSON.stringify(m.args)})`);
    } else if (m.type === "tool_result") {
      add("tool", `← ${m.text}`);
    } else if (m.type === "reply") {
      add("bot", m.text); setBusy(false);
    } else if (m.type === "error") {
      add("bot err", m.text); setBusy(false);
      if (m.text === "senha incorreta") { try { sessionStorage.removeItem("pw"); } catch (e) {} }
    }
  };
  ws.onclose = () => { setOnline(false); setBusy(false);
    if (!$("chat").hidden) add("bot err", "conexão com o servidor caiu — recarregue a página"); };
}

setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "status" })); }, 15000);

$("login").onsubmit = (e) => { e.preventDefault(); connect($("pw").value); };
$("chat").onsubmit = (e) => {
  e.preventDefault();
  const t = $("text").value.trim();
  if (!t || busy) return;
  add("user", t); $("text").value = ""; setBusy(true);
  ws.send(JSON.stringify({ type: "chat", text: t }));
};
$("stop").onclick = () => ws && ws.send(JSON.stringify({ type: "stop" }));

try { const pw = sessionStorage.getItem("pw"); if (pw) connect(pw); } catch (e) {}
</script>
</body>
</html>
